# Formatum requires both paths at boot time (FormatumConfig has no defaults for them),
# so every @QuarkusTest needs them. The paths are relative to the module directory,
# which is the working directory of the Surefire JVM.
formatum.metadata.config-path=src/test/resources/metadata-config-test.yml
formatum.templates.path=src/test/resources/test-templates
