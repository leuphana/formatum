name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  native-build:
    name: Native build
    needs: test
    runs-on: ubuntu-latest
    # Same builder image as the former GitLab pipeline. It runs as an
    # unprivileged user, so the job needs root to write into the workspace.
    container:
      image: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:23.1-java21
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-native-${{ hashFiles('pom.xml') }}
          restore-keys: maven-native-

      - name: Build native executable
        run: ./mvnw --batch-mode package -Dnative -DskipTests

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: native-runner
          path: target/*-runner
          retention-days: 1

  docker:
    name: Build and push image
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download native executable
        uses: actions/download-artifact@v4
        with:
          name: native-runner
          path: target/

      # Required for the GitHub Actions cache exporter: the default docker
      # driver cannot export build cache, the docker-container driver can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
